name: Publish Docker images

# Publishes the image to GHCR on every push to main and on version tags:
#   ghcr.io/<owner>/pinchive:latest       + :<ref>

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          python -m pip install ".[dev]"
          npm ci --prefix frontend
      - name: Test and build frontend
        run: |
          npm test --prefix frontend
          npm run build --prefix frontend
      - name: Test backend and check dependencies
        run: |
          python -m pytest
          python -m ruff check .
          python -m pip check

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # QEMU emulators so buildx can cross-build the linux/arm64 variant.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_OUTPUT"

      - name: Build & push image
        uses: docker/bake-action@v5
        with:
          files: docker-bake.hcl
          targets: default
          push: true
        env:
          # GHCR requires a lowercase path; github.repository is already lowercase.
          REGISTRY: ghcr.io/${{ github.repository }}
          VERSION: ${{ steps.ver.outputs.version }}
