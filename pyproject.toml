[project]
name = "pinchive"
version = "0.1.0"
description = "Self-hosted Pinterest board archiver. Inspired by TubeArchivist."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "aroxu" }]

dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "peewee>=3.17",   # DB layer: lightweight query builder, no SQLAlchemy
    "arq>=0.26",
    "redis>=5.0",
    "gallery-dl>=1.32",  # post-event --Print + post-filter abort for sync checkpoints
    "yt-dlp>=2024.8",  # gallery-dl's fallback for some Pinterest video/story pins
    "pillow>=10.0",    # perceptual dHash for duplicate detection
    "httpx>=0.27",
    "pydantic-settings>=2.3",
    "tzdata>=2025.2",  # IANA timezone database for TZ-based web display
]

[project.optional-dependencies]
dev = ["ruff>=0.5", "pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Pinned explicitly so a Ruff upgrade cannot silently change the gate. This is
# the set the codebase was written against (default rules + the import, bugbear,
# comprehension and pyupgrade families we actually enforce).
select = ["E", "F", "W", "I", "B", "C4", "UP", "ARG", "SIM"]
ignore = [
    "B008",    # FastAPI puts Depends()/Query() in defaults by design
    "UP037",   # quoted forward refs in dataclass fields are valid and harmless
    "SIM105",  # contextlib.suppress is not clearer in the tight IO loops here
    "UP042",   # str+Enum is deliberate: members are stored as DB/JSON strings
    "SIM108",  # an if/else block is more readable than a long ternary here
]

[tool.ruff.lint.per-file-ignores]
# arq passes a job context to every task, whether or not the task reads it.
"app/worker.py" = ["ARG001"]
# Tests intentionally reach past the service layer to set up and assert state,
# and stub callables ignore the arguments they are handed.
"tests/*" = ["ARG001", "ARG002", "ARG005"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
